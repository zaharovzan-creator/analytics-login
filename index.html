
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аналитика maxim</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      color: #222;
    }

    button {
      padding: 10px 16px;
      margin: 8px 0;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #c62828;
    }

    #report {
      margin-top: 25px;
      overflow-x: auto;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 7px;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #f0f0f0;
    }
  </style>
</head>

<body>

  <h2>Аналитика maxim</h2>

  <div id="g_id_onload"
       data-client_id="405088895649-r0p9j00so0u7lrm31h5mv7rskf5pobfs.apps.googleusercontent.com"
       data-callback="handleCredentialResponse">
  </div>

  <div class="g_id_signin"
       data-type="standard"
       data-size="large"
       data-theme="outline"
       data-text="sign_in_with"
       data-shape="rectangular">
  </div>

  <div id="status"></div>

  <div id="reports" hidden>
    <h3>Отчёты</h3>
    <button onclick="loadReport('Раздел 2')">
      Раздел 2
    </button>
  </div>

  <div id="report"></div>

<script>
const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbz6vfEYaw6pFjp2EvTK63JX1t2fmlpGjS6CXy8tHryopvDJt7w94GBJc0RRkwSONw/exec';

let currentToken = '';

function handleCredentialResponse(response) {
  currentToken = response.credential;

  const statusDiv = document.getElementById('status');
  statusDiv.className = '';
  statusDiv.textContent = 'Проверка доступа...';

  document.getElementById('reports').hidden = true;
  document.getElementById('report').innerHTML = '';

  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8'
    },
    body: JSON.stringify({
      token: currentToken
    }),
    redirect: 'follow'
  })
  .then(res => {
    if (!res.ok) {
      throw new Error('Ошибка сервера: ' + res.status);
    }
    return res.json();
  })
  .then(data => {
    if (!data.success) {
      throw new Error(data.error || 'Доступ запрещён');
    }

    statusDiv.className = 'success';
    statusDiv.textContent =
      'Авторизация успешна! Пользователь: ' + data.email +
      ' | Роль: ' +
      (data.role === 'admin' ? 'Администратор' : 'Пользователь');

    document.getElementById('reports').hidden = false;
  })
  .catch(err => {
    statusDiv.className = 'error';
    statusDiv.textContent = 'Ошибка: ' + err.message;
  });
}

function loadReport(reportName) {
  const reportDiv = document.getElementById('report');

  reportDiv.textContent = 'Загрузка отчёта...';

  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8'
    },
    body: JSON.stringify({
      token: currentToken,
      report: reportName
    }),
    redirect: 'follow'
  })
  .then(res => {
    if (!res.ok) {
      throw new Error('Ошибка сервера: ' + res.status);
    }
    return res.json();
  })
  .then(data => {
    if (!data.success) {
      throw new Error(data.error || 'Не удалось загрузить отчёт');
    }

    renderTable(data.headers, data.rows);
  })
  .catch(err => {
    reportDiv.textContent = 'Ошибка загрузки: ' + err.message;
  });
}

function renderTable(headers, rows) {
  const reportDiv = document.getElementById('report');

  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const tbody = document.createElement('tbody');

  const headerRow = document.createElement('tr');

  headers.forEach(value => {
    const th = document.createElement('th');
    th.textContent = value;
    headerRow.appendChild(th);
  });

  thead.appendChild(headerRow);

  rows.forEach(row => {
    const tr = document.createElement('tr');

    row.forEach(value => {
      const td = document.createElement('td');
      td.textContent = value;
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  table.appendChild(thead);
  table.appendChild(tbody);

  reportDiv.replaceChildren(table);
}
</script>

</body>
</html>
