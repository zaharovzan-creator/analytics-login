
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аналитика maxim</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      color: #222;
      background: #f7f8fa;
    }

    h2 {
      margin-bottom: 20px;
    }

    .panel {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 20px;
    }

    #status {
      margin-top: 18px;
      line-height: 1.6;
    }

    .success { color: #16803c; }
    .error { color: #c62828; }

    #reports {
      display: none;
    }

    .report-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
    }

    button {
      border: 1px solid #bbb;
      background: #fff;
      border-radius: 5px;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #edf2f7;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    button.active {
      background: #263f70;
      color: #fff;
      border-color: #263f70;
    }

    #report {
      margin-top: 20px;
    }

    .table-container {
      overflow: auto;
      max-height: 75vh;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      position: relative;
    }

    table {
      border-collapse: separate;
      border-spacing: 0;
      width: max-content;
      min-width: 100%;
      table-layout: fixed;
      font-size: 12px;
    }

    th, td {
      border-right: 1px solid #ddd;
      border-bottom: 1px solid #ddd;
      padding: 6px 8px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    th {
      background: #e9edf3;
      font-weight: bold;
      position: sticky;
      z-index: 5;
    }

    td {
      background: #fff;
    }

    td:first-child {
      text-align: left;
    }

    .sticky-col {
      position: sticky;
      z-index: 3;
      background: #f1f3f6 !important;
      text-align: left;
    }

    th.sticky-col {
      z-index: 8;
      background: #dce3ed !important;
    }

    tbody tr:nth-child(even) td:not(.sticky-col) {
      background: #f8f9fb;
    }

    tbody tr:hover td {
      background: #edf3fc;
    }

    tbody tr:hover td.sticky-col {
      background: #e3eaf4 !important;
    }

    .loading {
      padding: 20px;
      color: #555;
    }

    .report-title {
      margin: 20px 0 12px;
    }

    .user-info {
      color: #555;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      body {
        margin: 12px;
      }

      .panel {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <h2>Аналитика maxim</h2>

  <div class="panel">

    <div id="g_id_onload"
      data-client_id="405088895649-r0p9j00so0u7lrm31h5mv7rskf5pobfs.apps.googleusercontent.com"
      data-callback="handleCredentialResponse">
    </div>

    <div class="g_id_signin"
      data-type="standard"
      data-size="large"
      data-theme="outline"
      data-text="sign_in_with"
      data-shape="rectangular">
    </div>

    <div id="status"></div>

  </div>

  <div id="reports" class="panel">

    <h3>Отчёты</h3>

    <div class="user-info" id="userInfo"></div>

    <div class="report-buttons">

      <button onclick="loadReport('Раздел 1')">Раздел 1</button>
      <button onclick="loadReport('Раздел 2')">Раздел 2</button>
      <button onclick="loadReport('Раздел 3')">Раздел 3</button>
      <button onclick="loadReport('Раздел 4.1 без разбивки')">Раздел 4.1 без разбивки</button>
      <button onclick="loadReport('Раздел 4')">Раздел 4</button>
      <button onclick="loadReport('Раздел 5')">Раздел 5</button>
      <button onclick="loadReport('Раздел 5 (с кэф)')">Раздел 5 (с кэф)</button>
      <button onclick="loadReport('Раздел 5 по часам')">Раздел 5 по часам</button>
      <button onclick="loadReport('Раздел 5 (по часам с кэф)')">Раздел 5 (по часам с кэф)</button>

    </div>

  </div>

  <div id="report"></div>

<script>

const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbz6vfEYaw6pFjp2EvTK63JX1t2fmlpGjS6CXy8tHryopvDJt7w94GBJc0RRkwSONw/exec';

let currentToken = '';
let currentUser = null;

function handleCredentialResponse(response) {

  currentToken = response.credential;

  const statusDiv = document.getElementById('status');

  statusDiv.className = '';
  statusDiv.textContent = 'Проверка доступа...';

  document.getElementById('reports').style.display = 'none';
  document.getElementById('report').replaceChildren();

  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8'
    },
    body: JSON.stringify({
      token: currentToken
    }),
    redirect: 'follow'
  })

  .then(res => {
    if (!res.ok) {
      throw new Error('Ошибка сервера: ' + res.status);
    }
    return res.json();
  })

  .then(data => {

    if (!data.success) {
      throw new Error(data.error || 'Доступ запрещён');
    }

    currentUser = data;

    statusDiv.className = 'success';
    statusDiv.textContent = 'Авторизация успешна!';

    document.getElementById('userInfo').textContent =
      'Пользователь: ' + data.email +
      ' | Роль: ' +
      (data.role === 'admin' ? 'Администратор' : 'Пользователь');

    document.getElementById('reports').style.display = 'block';

  })

  .catch(err => {
    statusDiv.className = 'error';
    statusDiv.textContent = 'Ошибка: ' + err.message;
  });
}

function loadReport(reportName) {

  if (!currentToken) {
    alert('Сначала необходимо авторизоваться');
    return;
  }

  const reportDiv = document.getElementById('report');

  reportDiv.innerHTML = '';

  const title = document.createElement('h3');
  title.className = 'report-title';
  title.textContent = reportName;

  const loading = document.createElement('div');
  loading.className = 'loading';
  loading.textContent = 'Загрузка отчёта...';

  reportDiv.appendChild(title);
  reportDiv.appendChild(loading);

  const buttons = document.querySelectorAll('.report-buttons button');

  buttons.forEach(button => {
    button.disabled = true;
    button.classList.remove('active');

    if (button.textContent.trim() === reportName) {
      button.classList.add('active');
    }
  });

  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8'
    },
    body: JSON.stringify({
      token: currentToken,
      report: reportName
    }),
    redirect: 'follow'
  })

  .then(res => {
    if (!res.ok) {
      throw new Error('Ошибка сервера: ' + res.status);
    }
    return res.json();
  })

  .then(data => {

    if (!data.success) {
      throw new Error(data.error || 'Не удалось загрузить отчёт');
    }

    renderTable(
      data.headerRows || [],
      data.rows || [],
      reportName
    );

  })

  .catch(err => {
    reportDiv.textContent = 'Ошибка загрузки: ' + err.message;
  })

  .finally(() => {
    buttons.forEach(button => {
      button.disabled = false;
    });
  });
}

function renderTable(headerRows, rows, reportName) {

  const reportDiv = document.getElementById('report');
  const title = reportDiv.querySelector('.report-title');

  const container = document.createElement('div');
  container.className = 'table-container';

  const table = document.createElement('table');

  const thead = document.createElement('thead');
  const tbody = document.createElement('tbody');

  const frozenColumns = {
    'Раздел 1': 1,
    'Раздел 2': 2,
    'Раздел 3': 2,
    'Раздел 4.1 без разбивки': 2,
    'Раздел 4': 2,
    'Раздел 5': 2,
    'Раздел 5 (с кэф)': 2,
    'Раздел 5 по часам': 3,
    'Раздел 5 (по часам с кэф)': 4
  };

  const freezeCount = frozenColumns[reportName] || 1;

  const columnCount = Math.max(
    0,
    ...headerRows.map(row => row.length),
    ...rows.map(row => row.length)
  );

  const labelWidths = [145, 125, 135, 100];

  const colgroup = document.createElement('colgroup');

  for (let i = 0; i < columnCount; i++) {

    const col = document.createElement('col');

    col.style.width = i < freezeCount
      ? (labelWidths[i] || 110) + 'px'
      : '105px';

    colgroup.appendChild(col);
  }

  table.appendChild(colgroup);

  const leftOffsets = [];
  let leftPosition = 0;

  for (let i = 0; i < freezeCount; i++) {
    leftOffsets[i] = leftPosition;
    leftPosition += labelWidths[i] || 110;
  }

  // Заголовки
  headerRows.forEach(row => {

    const tr = document.createElement('tr');

    row.forEach((value, index) => {

      const th = document.createElement('th');
      th.textContent = value;

      if (index < freezeCount) {
        th.classList.add('sticky-col');
        th.style.left = leftOffsets[index] + 'px';
      }

      tr.appendChild(th);

    });

    thead.appendChild(tr);

  });

  // Данные
  rows.forEach(row => {

    const tr = document.createElement('tr');

    row.forEach((value, index) => {

      const td = document.createElement('td');
      td.textContent = value;

      if (index < freezeCount) {
        td.classList.add('sticky-col');
        td.style.left = leftOffsets[index] + 'px';
      }

      tr.appendChild(td);

    });

    tbody.appendChild(tr);

  });

  table.appendChild(thead);
  table.appendChild(tbody);

  container.appendChild(table);

  reportDiv.replaceChildren(title, container);

  // Фиксация всех строк заголовка
  let topPosition = 0;

  Array.from(thead.rows).forEach(tr => {

    const height = tr.getBoundingClientRect().height;

    tr.querySelectorAll('th').forEach(th => {
      th.style.top = topPosition + 'px';
    });

    topPosition += height;

  });

  const info = document.createElement('p');
  info.className = 'user-info';
  info.textContent = 'Строк данных: ' + rows.length;

  reportDiv.appendChild(info);
}

</script>

</body>
</html>
