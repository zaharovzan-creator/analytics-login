
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аналитика maxim</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      color: #222;
      background: #f7f8fa;
    }

    h2 { margin-bottom: 20px; }

    .panel {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 20px;
    }

    #status {
      margin-top: 18px;
      line-height: 1.6;
    }

    .success { color: #16803c; }
    .error { color: #c62828; }

    #reports { display: none; }

    .report-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
    }

    button {
      border: 1px solid #bbb;
      background: #fff;
      border-radius: 5px;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover { background: #edf2f7; }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    button.active {
      background: #263f70;
      color: #fff;
      border-color: #263f70;
    }

    #report { margin-top: 20px; }

    .table-container {
      overflow: auto;
      max-height: 75vh;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      position: relative;
      isolation: isolate;
    }

    table {
      border-collapse: separate;
      border-spacing: 0;
      width: max-content;
      min-width: 100%;
      table-layout: fixed;
      font-size: 12px;
    }

    th, td {
      border-right: 1px solid #ddd;
      border-bottom: 1px solid #ddd;
      padding: 6px 8px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    th {
      background: #e9edf3;
      font-weight: bold;
      position: sticky;
      z-index: 5;
    }

    td { background: #fff; }
    td:first-child { text-align: left; }

    .sticky-col {
      position: sticky;
      z-index: 3;
      background: #f1f3f6 !important;
      text-align: left;
    }

    th.sticky-col {
      z-index: 8;
      background: #dce3ed !important;
    }

    tbody tr:nth-child(even) td:not(.sticky-col) {
      background: #f8f9fb;
    }

    tbody tr:hover td { background: #edf3fc; }
    tbody tr:hover td.sticky-col { background: #e3eaf4 !important; }

    .loading {
      padding: 20px;
      color: #555;
    }

    .report-title { margin: 20px 0 12px; }

    .user-info {
      color: #555;
      font-size: 14px;
    }

    /* Администрирование */

    #adminButton {
      display: none;
      margin-top: 15px;
      background: #263f70;
      color: white;
      border-color: #263f70;
    }

    #adminPanel {
      display: none;
      margin-top: 20px;
      border-top: 1px solid #ddd;
      padding-top: 18px;
    }

    .admin-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 15px;
    }

    .admin-form {
      border: 1px solid #ddd;
      border-radius: 7px;
      padding: 16px;
      margin: 15px 0;
      background: #fafbfc;
      max-width: 650px;
    }

    .form-field {
      margin-bottom: 13px;
    }

    .form-field label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .form-field input,
    .form-field select {
      width: 100%;
      padding: 10px;
      border: 1px solid #bbb;
      border-radius: 5px;
      font-size: 14px;
      background: white;
    }

    .form-hint {
      color: #777;
      font-size: 12px;
      margin-top: 5px;
    }

    .admin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .primary-button {
      background: #263f70;
      color: white;
      border-color: #263f70;
    }

    .danger-button {
      color: #b42318;
      border-color: #d9a09b;
    }

    .admin-table-wrap {
      overflow-x: auto;
      margin-top: 15px;
    }

    .admin-table {
      width: 100%;
      min-width: 600px;
      border-collapse: collapse;
      table-layout: auto;
      font-size: 13px;
    }

    .admin-table th,
    .admin-table td {
      position: static;
      text-align: left;
      white-space: normal;
      padding: 9px;
      background: white;
    }

    .admin-table th {
      background: #e9edf3;
    }

    .admin-table td:last-child {
      white-space: nowrap;
    }

    .admin-table button {
      margin: 2px;
      padding: 6px 9px;
      font-size: 12px;
    }

    #adminStatus {
      margin: 10px 0;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      body { margin: 12px; }
      .panel { padding: 12px; }
    }
  </style>
</head>

<body>

  <h2>Аналитика maxim</h2>

  <div class="panel">

    <div id="g_id_onload"
      data-client_id="405088895649-r0p9j00so0u7lrm31h5mv7rskf5pobfs.apps.googleusercontent.com"
      data-callback="handleCredentialResponse">
    </div>

    <div class="g_id_signin"
      data-type="standard"
      data-size="large"
      data-theme="outline"
      data-text="sign_in_with"
      data-shape="rectangular">
    </div>

    <div id="status"></div>

  </div>

  <div id="reports" class="panel">

    <h3>Отчёты</h3>

    <div class="user-info" id="userInfo"></div>

    <button id="adminButton" onclick="toggleAdminPanel()">
      Администрирование
    </button>

    <div id="adminPanel">

      <h3>Управление пользователями</h3>

      <div class="admin-toolbar">
        <button class="primary-button" onclick="newUser()">
          + Добавить пользователя
        </button>

        <button onclick="loadAdminUsers()">
          Обновить список
        </button>
      </div>

      <div id="adminStatus"></div>

      <div class="admin-form" id="userForm" style="display:none;">

        <h4 id="formTitle">Новый пользователь</h4>

        <div class="form-field">
          <label for="userEmail">Google-почта</label>
          <input
            type="email"
            id="userEmail"
            placeholder="user@gmail.com"
            autocomplete="off">
        </div>

        <div class="form-field">
          <label for="userRole">Роль</label>
          <select id="userRole" onchange="changeRoleFields()">
            <option value="user">Пользователь</option>
            <option value="admin">Администратор</option>
          </select>
        </div>

        <div class="form-field" id="citiesField">
          <label for="userCities">Города через запятую</label>
          <input
            type="text"
            id="userCities"
            placeholder="Максим Курган, Максим Тюмень"
            autocomplete="off">
          <div class="form-hint">
            Названия должны совпадать с названиями подразделений в сводных таблицах.
          </div>
        </div>

        <div class="admin-actions">
          <button class="primary-button" id="saveUserButton" onclick="saveUserForm()">
            Сохранить
          </button>

          <button onclick="cancelUserForm()">
            Отмена
          </button>
        </div>

      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Email</th>
              <th>Роль</th>
              <th>Города</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr>
              <td colspan="4">Загрузка...</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

    <div class="report-buttons">

      <button data-report="Раздел 1" onclick="loadReport('Раздел 1')">
        Общий PriceIndex (РФ)
      </button>

      <button data-report="Раздел 2" onclick="loadReport('Раздел 2')">
        PriceIndex по неделям
      </button>

      <button data-report="Раздел 3" onclick="loadReport('Раздел 3')">
        PriceIndex по дням
      </button>

      <button data-report="Раздел 4.1 без разбивки" onclick="loadReport('Раздел 4.1 без разбивки')">
        PriceIndex по периодам и неделям
      </button>

      <button data-report="Раздел 4" onclick="loadReport('Раздел 4')">
        PriceIndex по периодам и неделям (Surge/без Surge)
      </button>

      <button data-report="Раздел 5" onclick="loadReport('Раздел 5')">
        PriceIndex по км и неделям
      </button>

      <button data-report="Раздел 5 (с кэф)" onclick="loadReport('Раздел 5 (с кэф)')">
        PriceIndex по км и неделям (Surge/без Surge)
      </button>

      <button data-report="Раздел 5 по часам" onclick="loadReport('Раздел 5 по часам')">
        PriceIndex по км, по периодам и неделям
      </button>

      <button data-report="Раздел 5 (по часам с кэф)" onclick="loadReport('Раздел 5 (по часам с кэф)')">
        PriceIndex по км, по периодам и неделям (Surge/без Surge)
      </button>

    </div>

  </div>

  <div id="report"></div>

<script>

const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbz6vfEYaw6pFjp2EvTK63JX1t2fmlpGjS6CXy8tHryopvDJt7w94GBJc0RRkwSONw/exec';

let currentToken = '';
let currentUser = null;
let editingEmail = null;


const REPORT_LABELS = {
  'Раздел 1': 'Общий PriceIndex (РФ)',
  'Раздел 2': 'PriceIndex по неделям',
  'Раздел 3': 'PriceIndex по дням',
  'Раздел 4.1 без разбивки': 'PriceIndex по периодам и неделям',
  'Раздел 4': 'PriceIndex по периодам и неделям (Surge/без Surge)',
  'Раздел 5': 'PriceIndex по км и неделям',
  'Раздел 5 (с кэф)': 'PriceIndex по км и неделям (Surge/без Surge)',
  'Раздел 5 по часам': 'PriceIndex по км, по периодам и неделям',
  'Раздел 5 (по часам с кэф)': 'PriceIndex по км, по периодам и неделям (Surge/без Surge)'
};


function getReportLabel(reportName) {
  return REPORT_LABELS[reportName] || reportName;
}


/* =====================================================
   ОБЩАЯ ФУНКЦИЯ ЗАПРОСОВ
===================================================== */

async function apiRequest(data) {
  const response = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8'
    },
    body: JSON.stringify({
      token: currentToken,
      ...data
    }),
    redirect: 'follow'
  });

  if (!response.ok) {
    throw new Error('Ошибка сервера: ' + response.status);
  }

  const result = await response.json();

  if (!result.success) {
    throw new Error(result.error || 'Ошибка выполнения запроса');
  }

  return result;
}


/* =====================================================
   АВТОРИЗАЦИЯ
===================================================== */

async function handleCredentialResponse(response) {

  currentToken = response.credential;

  const statusDiv = document.getElementById('status');

  statusDiv.className = '';
  statusDiv.textContent = 'Проверка доступа...';

  document.getElementById('reports').style.display = 'none';
  document.getElementById('report').replaceChildren();

  document.getElementById('adminPanel').style.display = 'none';
  document.getElementById('adminButton').style.display = 'none';

  try {
    const data = await apiRequest({});

    currentUser = data;

    statusDiv.className = 'success';
    statusDiv.textContent = 'Авторизация успешна!';

    document.getElementById('userInfo').textContent =
      'Пользователь: ' + data.email +
      ' | Роль: ' +
      (data.role === 'admin' ? 'Администратор' : 'Пользователь');

    document.getElementById('reports').style.display = 'block';

    if (data.role === 'admin') {
      document.getElementById('adminButton').style.display = 'inline-block';
    }

  } catch (err) {
    statusDiv.className = 'error';
    statusDiv.textContent = 'Ошибка: ' + err.message;
  }
}


/* =====================================================
   АДМИНИСТРИРОВАНИЕ
===================================================== */

function toggleAdminPanel() {
  if (!currentUser || currentUser.role !== 'admin') {
    return;
  }

  const panel = document.getElementById('adminPanel');

  const isOpen = panel.style.display === 'block';

  panel.style.display = isOpen ? 'none' : 'block';

  if (!isOpen) {
    loadAdminUsers();
  }
}


function setAdminStatus(message, type) {
  const element = document.getElementById('adminStatus');

  element.className = type || '';
  element.textContent = message || '';
}


async function loadAdminUsers() {
  if (!currentUser || currentUser.role !== 'admin') {
    return;
  }

  const tbody = document.getElementById('usersTableBody');

  tbody.innerHTML = '<tr><td colspan="4">Загрузка пользователей...</td></tr>';

  setAdminStatus('', '');

  try {
    const data = await apiRequest({
      action: 'listUsers'
    });

    renderUsersTable(data.users || []);

  } catch (error) {
    tbody.innerHTML = '<tr><td colspan="4">Не удалось загрузить список</td></tr>';
    setAdminStatus(error.message, 'error');
  }
}


function renderUsersTable(users) {
  const tbody = document.getElementById('usersTableBody');
  tbody.replaceChildren();

  if (!users.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');

    td.colSpan = 4;
    td.textContent = 'Пользователей пока нет';

    tr.appendChild(td);
    tbody.appendChild(tr);
    return;
  }

  users.forEach(user => {
    const tr = document.createElement('tr');

    const email = document.createElement('td');
    email.textContent = user.email;

    const role = document.createElement('td');
    role.textContent =
      user.role === 'admin' ? 'Администратор' : 'Пользователь';

    const cities = document.createElement('td');
    cities.textContent =
      user.role === 'admin'
        ? 'Все города'
        : (user.cities || []).join(', ');

    const actions = document.createElement('td');

    const editButton = document.createElement('button');
    editButton.textContent = 'Изменить';
    editButton.addEventListener('click', () => editUser(user));

    const deleteButton = document.createElement('button');
    deleteButton.textContent = 'Удалить';
    deleteButton.className = 'danger-button';
    deleteButton.addEventListener('click', () => removeUser(user.email));

    actions.appendChild(editButton);
    actions.appendChild(deleteButton);

    tr.appendChild(email);
    tr.appendChild(role);
    tr.appendChild(cities);
    tr.appendChild(actions);

    tbody.appendChild(tr);
  });
}


function newUser() {
  editingEmail = null;

  document.getElementById('formTitle').textContent =
    'Добавление пользователя';

  document.getElementById('userEmail').value = '';
  document.getElementById('userEmail').disabled = false;
  document.getElementById('userRole').value = 'user';
  document.getElementById('userCities').value = '';

  changeRoleFields();

  document.getElementById('userForm').style.display = 'block';
  setAdminStatus('', '');

  document.getElementById('userEmail').focus();
}


function editUser(user) {
  editingEmail = user.email;

  document.getElementById('formTitle').textContent =
    'Редактирование пользователя';

  document.getElementById('userEmail').value = user.email;
  document.getElementById('userEmail').disabled = true;

  document.getElementById('userRole').value = user.role;

  document.getElementById('userCities').value =
    (user.cities || []).join(', ');

  changeRoleFields();

  document.getElementById('userForm').style.display = 'block';

  setAdminStatus('', '');

  document.getElementById('userForm').scrollIntoView({
    behavior: 'smooth',
    block: 'nearest'
  });
}


function changeRoleFields() {
  const role = document.getElementById('userRole').value;

  document.getElementById('citiesField').style.display =
    role === 'admin' ? 'none' : 'block';
}


function cancelUserForm() {
  editingEmail = null;

  document.getElementById('userForm').style.display = 'none';
  document.getElementById('userEmail').disabled = false;

  setAdminStatus('', '');
}


async function saveUserForm() {
  const email = document.getElementById('userEmail').value.trim();
  const role = document.getElementById('userRole').value;
  const cities = document.getElementById('userCities').value.trim();

  const button = document.getElementById('saveUserButton');

  if (!email) {
    setAdminStatus('Укажите email пользователя', 'error');
    return;
  }

  if (role === 'user' && !cities) {
    setAdminStatus('Укажите хотя бы один город', 'error');
    return;
  }

  button.disabled = true;
  button.textContent = 'Сохранение...';

  try {
    const data = await apiRequest({
      action: 'saveUser',
      email: email,
      role: role,
      cities: cities
    });

    setAdminStatus(data.message, 'success');

    cancelUserForm();

    await loadAdminUsers();

  } catch (error) {
    setAdminStatus(error.message, 'error');

  } finally {
    button.disabled = false;
    button.textContent = 'Сохранить';
  }
}


async function removeUser(email) {
  if (email === currentUser.email) {
    alert('Нельзя удалить собственную учётную запись.');
    return;
  }

  if (!confirm('Удалить пользователя ' + email + '?')) {
    return;
  }

  try {
    const data = await apiRequest({
      action: 'deleteUser',
      email: email
    });

    setAdminStatus(data.message, 'success');

    await loadAdminUsers();

  } catch (error) {
    setAdminStatus(error.message, 'error');
  }
}


/* =====================================================
   ЗАГРУЗКА ОТЧЁТОВ
===================================================== */

async function loadReport(reportName) {
  if (!currentToken) {
    alert('Сначала необходимо авторизоваться');
    return;
  }

  const reportDiv = document.getElementById('report');

  reportDiv.innerHTML = '';

  const title = document.createElement('h3');
  title.className = 'report-title';
  title.textContent = getReportLabel(reportName);

  const loading = document.createElement('div');
  loading.className = 'loading';
  loading.textContent = 'Загрузка отчёта...';

  reportDiv.appendChild(title);
  reportDiv.appendChild(loading);

  const buttons = document.querySelectorAll('.report-buttons button');

  buttons.forEach(button => {
    button.disabled = true;
    button.classList.remove('active');

    if (button.dataset.report === reportName) {
      button.classList.add('active');
    }
  });

  try {
    const data = await apiRequest({
      report: reportName
    });

    renderTable(
      data.headerRows || [],
      data.rows || [],
      reportName
    );

  } catch (err) {
    reportDiv.textContent = 'Ошибка загрузки: ' + err.message;

  } finally {
    buttons.forEach(button => {
      button.disabled = false;
    });
  }
}


/* =====================================================
   НАСТРОЙКИ ТАБЛИЦ
===================================================== */

function getColumnWidths(reportName) {
  const settings = {
    'Раздел 1': [85],
    'Раздел 2': [110, 85],
    'Раздел 3': [110, 85],
    'Раздел 4.1 без разбивки': [110, 125, 115],
    'Раздел 4': [110, 125, 115],
    'Раздел 5': [110, 90],
    'Раздел 5 (с кэф)': [110, 90],
    'Раздел 5 по часам': [110, 105, 125, 115],
    'Раздел 5 (по часам с кэф)': [110, 105, 125, 115]
  };

  return settings[reportName] || [110, 110, 110, 110];
}


function getFrozenColumns(reportName) {
  const settings = {
    'Раздел 1': 1,
    'Раздел 2': 2,
    'Раздел 3': 2,
    'Раздел 4.1 без разбивки': 3,
    'Раздел 4': 3,
    'Раздел 5': 2,
    'Раздел 5 (с кэф)': 2,
    'Раздел 5 по часам': 4,
    'Раздел 5 (по часам с кэф)': 4
  };

  return settings[reportName] || 1;
}


function isColumnEmpty(headerRows, rows, columnIndex) {
  const allRows = headerRows.concat(rows);

  return allRows.every(row => {
    return String(row[columnIndex] || '').trim() === '';
  });
}


/* =====================================================
   ОТРИСОВКА ОТЧЁТА
===================================================== */

function renderTable(headerRows, rows, reportName) {
  const reportDiv = document.getElementById('report');
  const title = reportDiv.querySelector('.report-title');

  const container = document.createElement('div');
  container.className = 'table-container';

  const table = document.createElement('table');

  const thead = document.createElement('thead');
  const tbody = document.createElement('tbody');

  const columnCount = Math.max(
    0,
    ...headerRows.map(row => row.length),
    ...rows.map(row => row.length)
  );

  const columnWidths = getColumnWidths(reportName);

  const frozenColumns = new Set();
  const baseFrozenCount = getFrozenColumns(reportName);

  for (let i = 0; i < baseFrozenCount; i++) {
    frozenColumns.add(i);
  }

  const hiddenColumns = new Set();

  if (reportName === 'Раздел 5') {
    for (let i = 1; i < columnCount; i++) {
      if (isColumnEmpty(headerRows, rows, i)) {
        hiddenColumns.add(i);
      }
    }
  }

  hiddenColumns.forEach(index => {
    frozenColumns.delete(index);
  });

  const widths = [];

  for (let i = 0; i < columnCount; i++) {
    widths[i] = columnWidths[i] || 105;

    if (hiddenColumns.has(i)) {
      widths[i] = 0;
    }
  }

  const leftOffsets = {};
  let leftPosition = 0;

  for (let i = 0; i < columnCount; i++) {
    if (frozenColumns.has(i)) {
      leftOffsets[i] = leftPosition;
      leftPosition += widths[i];
    }
  }

  const colgroup = document.createElement('colgroup');

  for (let i = 0; i < columnCount; i++) {
    const col = document.createElement('col');

    col.style.width = widths[i] + 'px';

    if (hiddenColumns.has(i)) {
      col.style.display = 'none';
    }

    colgroup.appendChild(col);
  }

  table.appendChild(colgroup);

  headerRows.forEach(row => {
    const tr = document.createElement('tr');

    for (let i = 0; i < columnCount; i++) {
      if (hiddenColumns.has(i)) continue;

      const th = document.createElement('th');
      th.textContent = row[i] || '';

      if (frozenColumns.has(i)) {
        th.classList.add('sticky-col');
        th.style.left = leftOffsets[i] + 'px';
      }

      tr.appendChild(th);
    }

    thead.appendChild(tr);
  });

  rows.forEach(row => {
    const tr = document.createElement('tr');

    for (let i = 0; i < columnCount; i++) {
      if (hiddenColumns.has(i)) continue;

      const td = document.createElement('td');
      td.textContent = row[i] || '';

      if (frozenColumns.has(i)) {
        td.classList.add('sticky-col');
        td.style.left = leftOffsets[i] + 'px';
      }

      tr.appendChild(td);
    }

    tbody.appendChild(tr);
  });

  table.appendChild(thead);
  table.appendChild(tbody);

  container.appendChild(table);

  reportDiv.replaceChildren(title, container);

  let topPosition = 0;

  Array.from(thead.rows).forEach(tr => {
    const height = tr.getBoundingClientRect().height;

    tr.querySelectorAll('th').forEach(th => {
      th.style.top = topPosition + 'px';
    });

    topPosition += height;
  });

  const info = document.createElement('p');
  info.className = 'user-info';
  info.textContent = 'Строк данных: ' + rows.length;

  reportDiv.appendChild(info);
}

</script>

</body>
</html>
